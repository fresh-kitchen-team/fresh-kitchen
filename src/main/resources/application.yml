spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
jwt:
  secret: ${JWT_SECRET}
  access-expiration-minutes: 30
  refresh-expiration-days: 14

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    app-key: ${KAKAO_APP_KEY:}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    token: ${AI_SERVER_TOKEN}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:30000}

image:
  storage:
    type: ${IMAGE_STORAGE_TYPE:local}
    local:
      root-dir: ${IMAGE_STORAGE_LOCAL_ROOT_DIR:uploads}
      public-base-url: ${IMAGE_STORAGE_LOCAL_PUBLIC_BASE_URL:/uploads}
    s3:
      region: ${AWS_REGION:}
      bucket: ${AWS_S3_BUCKET:}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      public-base-url: ${IMAGE_STORAGE_S3_PUBLIC_BASE_URL:}
