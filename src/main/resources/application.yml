spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.0-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
          options:
            model: text-embedding-004
    retry:
      max-attempts: 3
      on-client-errors: false # 4xx(429 Rate Limit 포함) 에러는 재시도해도 동일하게 실패하므로 비활성화 (제미나이 챗봇 토큰 아끼기)
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 768
jwt:
  secret: ${JWT_SECRET}
  access-expiration-minutes: 30
  refresh-expiration-days: 14

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL}
    token: ${AI_SERVER_TOKEN}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:30000}
