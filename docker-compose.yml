version: '3.8'
services:
  fresh-kitchen-server:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    container_name: fresh-kitchen-server
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AI_SERVER_BASE_URL=${AI_SERVER_BASE_URL}
      - AI_SERVER_TOKEN=${AI_SERVER_TOKEN}
      - AI_SERVER_CONNECT_TIMEOUT_MS=${AI_SERVER_CONNECT_TIMEOUT_MS:-3000}
      - AI_SERVER_READ_TIMEOUT_MS=${AI_SERVER_READ_TIMEOUT_MS:-30000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_APP_KEY=${KAKAO_APP_KEY:-}
      - REDIS_HOST=${REDIS_HOST:?REDIS_HOST is required}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - IMAGE_STORAGE_LOCAL_ROOT_DIR=${IMAGE_STORAGE_LOCAL_ROOT_DIR:-uploads}
      - IMAGE_STORAGE_PUBLIC_BASE_URL=${IMAGE_STORAGE_PUBLIC_BASE_URL:-/uploads}
    ports:
      - "8080:8080"
    restart: unless-stopped
