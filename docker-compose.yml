version: '3.8'
services:
  fresh-kitchen-server:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    container_name: fresh-kitchen-server
    environment:
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - AI_SERVER_BASE_URL=${AI_SERVER_BASE_URL}
      - AI_SERVER_TOKEN=${AI_SERVER_TOKEN}
      - AI_SERVER_CONNECT_TIMEOUT_MS=${AI_SERVER_CONNECT_TIMEOUT_MS:-3000}
      - AI_SERVER_READ_TIMEOUT_MS=${AI_SERVER_READ_TIMEOUT_MS:-30000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID:-}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_APP_KEY=${KAKAO_APP_KEY:-}
      - REDIS_HOST=${REDIS_HOST:?REDIS_HOST is required}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - IMAGE_STORAGE_LOCAL_ROOT_DIR=${IMAGE_STORAGE_LOCAL_ROOT_DIR:-uploads}
      - IMAGE_STORAGE_LOCAL_PUBLIC_BASE_URL=${IMAGE_STORAGE_LOCAL_PUBLIC_BASE_URL:-/uploads}
      - IMAGE_STORAGE_S3_PUBLIC_BASE_URL=${IMAGE_STORAGE_S3_PUBLIC_BASE_URL:-}
      - IMAGE_STORAGE_TYPE=${IMAGE_STORAGE_TYPE:-local}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MAIL_USERNAME=${MAIL_USERNAME:?MAIL_USERNAME is required}
      - MAIL_PASSWORD=${MAIL_PASSWORD:?MAIL_PASSWORD is required}
      - INQUIRY_ADMIN_EMAIL=${INQUIRY_ADMIN_EMAIL:?INQUIRY_ADMIN_EMAIL is required}
      - LEGAL_TERMS_URL=${LEGAL_TERMS_URL:?LEGAL_TERMS_URL is required}
      - LEGAL_PRIVACY_URL=${LEGAL_PRIVACY_URL:?LEGAL_PRIVACY_URL is required}
      - FCM_FIREBASE_CREDENTIALS_LOCATION=${FCM_FIREBASE_CREDENTIALS_LOCATION:-classpath:firebase/firebase.json}
      - FCM_EXPIRING_NOTIFICATION_ENABLED=${FCM_EXPIRING_NOTIFICATION_ENABLED:-true}
      - FCM_EXPIRING_NOTIFICATION_CRON=${FCM_EXPIRING_NOTIFICATION_CRON:-0 0 9 * * *}
      - FCM_EXPIRING_NOTIFICATION_ZONE=${FCM_EXPIRING_NOTIFICATION_ZONE:-Asia/Seoul}
      - FCM_EXPIRING_NOTIFICATION_DAYS_AHEAD=${FCM_EXPIRING_NOTIFICATION_DAYS_AHEAD:-1}
    ports:
      - "8080:8080"
    restart: unless-stopped
